<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- Center large star -->
    <g id="star-large">
      <polygon points="0,-65 19.1,-20.1 61.8,-20.1 27.3,8.5 40.5,52.6 0,24.8 -40.5,52.6 -27.3,8.5 -61.8,-20.1 -19.1,-20.1" fill="#ffffff"/>
    </g>
    <!-- Corner stars -->
    <g id="star-corner">
      <polygon points="0,-36 10.6,-11.1 34.2,-11.1 15.1,4.7 22.4,29.1 0,13.7 -22.4,29.1 -15.1,4.7 -34.2,-11.1 -10.6,-11.1" fill="#ffffff"/>
    </g>
  </defs>

  <!-- 4 horizontal stripes: Green, Yellow, Green, Yellow -->
  <!-- 1. Green -->
  <rect x="0" y="0" width="1000" height="175" fill="#00923f"/>
  <!-- 2. Yellow -->
  <rect x="0" y="175" width="1000" height="175" fill="#f8c300"/>
  <!-- 3. Green -->
  <rect x="0" y="350" width="1000" height="175" fill="#00923f"/>
  <!-- 4. Yellow -->
  <rect x="0" y="525" width="1000" height="175" fill="#f8c300"/>

  <!-- Dark blue canton (top-left, 350x350) -->
  <rect x="0" y="0" width="350" height="350" fill="#1b1265"/>

  <!-- 5 White stars -->
  <!-- Center star -->
  <use href="#star-large" x="175" y="175"/>
  <!-- 4 Corner stars -->
  <use href="#star-corner" x="65" y="65"/>
  <use href="#star-corner" x="285" y="65"/>
  <use href="#star-corner" x="65" y="285"/>
  <use href="#star-corner" x="285" y="285"/>
</svg>
